[project]
name = "btcusdt-quant-scaffold"
version = "0.1.0"
description = "Safe local BTCUSDT v7.18 quant trading scaffold derived from ProjectMD"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = ["lightgbm", "catboost", "optuna", "shap"]
lineage = ["mlflow", "dvc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Native extensions can ignore Python-level interruption while consuming CPU.
# Make any such test emit all-thread tracebacks and terminate the pytest process
# rather than silently run indefinitely.
faulthandler_timeout = 120
faulthandler_exit_on_timeout = true
