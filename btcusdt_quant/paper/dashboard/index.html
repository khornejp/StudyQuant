<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>BTCUSDT Paper</title><script src="/plotly.min.js"></script>
<style>body{font:14px system-ui;margin:20px;background:#111;color:#ddd}button{margin:4px;padding:8px}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #444;padding:6px;text-align:right}th:first-child,td:first-child{text-align:left}.warn{color:#ffb347}</style></head>
<body><h1>BTCUSDT Paper</h1><div id="health"></div>
<nav><button onclick="show('books')">Books</button><button onclick="show('trades')">Trades</button><button onclick="show('signals')">Signals</button><button onclick="show('reference')">Research reference</button><input id="bookFilter" placeholder="book filter"><button onclick="show('trades')">Filter</button><a href="/api/trades.csv">CSV</a></nav>
<div id="chart"></div><div id="drawdown"></div><div id="monthly"></div><div id="price"></div><section id="content"></section>
<script>
const api=p=>fetch(p).then(r=>r.json());
function table(rows){if(!rows.length)return '<p>데이터 없음</p>';let k=Object.keys(rows[0]);return '<table><tr>'+k.map((x,i)=>`<th onclick="sortTable(${i})">${x}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+k.map(x=>`<td>${typeof r[x]==='object'?JSON.stringify(r[x]):r[x]??''}</td>`).join('')+'</tr>').join('')+'</table>'}
async function show(x){let suffix=x==='trades'&&bookFilter.value?'?book='+encodeURIComponent(bookFilter.value):'';let d=await api('/api/'+x+suffix);document.querySelector('#content').innerHTML=table(d.rows||[])}
function sortTable(n){let t=document.querySelector('#content table'),r=[...t.rows].slice(1).sort((a,b)=>a.cells[n].innerText.localeCompare(b.cells[n].innerText,undefined,{numeric:true}));r.forEach(x=>t.appendChild(x))}
async function refresh(){let h=await api('/api/health'),b=h.book_ticker,n=h.notifications;document.querySelector('#health').innerHTML=`mode=${h.mode} last=${h.last_update||'-'} gaps=${h.latest.filter(x=>x.gaps).length} | ${h.telegram.label} | outbox 대기 ${n.pending} 실패 ${n.failed} | bookTicker 행 ${b.rows} 갭 ${b.gaps} 갱신 ${b.last_update||'-'} | disk=${(100*h.disk_free_ratio).toFixed(1)}% <span class="${h.disk_warning?'warn':''}">${h.disk_warning?'LOW DISK':''}</span>`;let c=await api('/api/chart'),layout=t=>({paper_bgcolor:'#111',plot_bgcolor:'#111',font:{color:'#ddd'},title:t});Plotly.react('chart',c.series.map(s=>({x:s.date,y:s.cumulative_net_bps,name:s.book+' '+s.boundary})),layout('Cumulative net bps'));Plotly.react('drawdown',c.series.map(s=>({x:s.date,y:s.drawdown_bps,name:s.book+' '+s.boundary})),layout('Drawdown bps'));Plotly.react('monthly',c.series.map(s=>({x:Object.keys(s.monthly),y:Object.values(s.monthly),type:'bar',name:s.book+' '+s.boundary})),layout('Monthly P&L'));let p=await api('/api/price');Plotly.react('price',[{x:p.price.map(x=>x.open_time),y:p.price.map(x=>x.close),name:'BTCUSDT'},{x:p.markers.map(x=>x.entry_time),y:p.markers.map(x=>x.entry_price),mode:'markers',name:'Entry'},{x:p.markers.map(x=>x.exit_time),y:p.markers.map(x=>x.exit_price),mode:'markers',name:'Exit'}],layout('Price and trades'))}
refresh();show('books');setInterval(refresh,60000);
</script></body></html>
