<script>
'use strict';
const BOOKS=['C1','C1_5m','C1_T1','F3','E1','C4'], TF_SEC={"1m":60,"5m":300,"15m":900,"1h":3600,"4h":14400,"1d":86400};
const state={tf:'1h',book:null,tab:'positions',data:{},sort:{key:null,asc:true},initialChart:true,markers:[],positionLine:null,liquidationLine:null,conditionCharts:[],conditionObservers:[],rangeHandlers:[]};
const $=s=>document.querySelector(s), api=async path=>{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(`${r.status} ${path}`);return r.json()};
const num=(v,d=1)=>v==null?'—':Number(v).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const bps=v=>v==null?'—':`${num(v,1)} bps`, pct=v=>v==null?'—':`${num(v*100,1)}%`;
const ratioPct=v=>v/(1+v)*100;
const usd=v=>v==null?'—':`$${num(v,2)}`, pctValue=v=>v==null?'—':`${num(v,1)}%`, bookLabel=v=>{const s=String(v).replace('K03_TRAIL','K03 추적 손절(비교)').replace('K03_S150','K03 고정 손절 -150(비교)').replace('K03_V3','K03 변동성 급등 손절(비교)').replace('B2_BE','B2 본전 이동(비교)').replace('B2_S150','B2 고정 손절 -150(비교)').replace('B2_V3','B2 변동성 급등 손절(비교)').replace('C1_5m','C1 역추세5분 (비교)').replace('C1_T1','C1 T+1분 진입 (비교)').replace('_x3',' ×3');return /^K(?:2[5-9]|30)(?:_|$)/.test(s)?`${s} (연구 음수)`:s};
const utcTip=v=>v?new Date(v).toISOString():'', kst=v=>v?new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'2-digit',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v)):'—';
// Chart times are unix seconds (UTC); show them in KST on axes and crosshair.
const kstDate=t=>new Date((t+32400)*1000), two=n=>String(n).padStart(2,'0'), kstAxis={localization:{locale:'ko-KR',timeFormatter:t=>{const d=kstDate(t);return `${String(d.getUTCFullYear()).slice(2)}.${two(d.getUTCMonth()+1)}.${two(d.getUTCDate())} ${two(d.getUTCHours())}:${two(d.getUTCMinutes())} KST`}},tickMarkFormatter:(t,type)=>{const d=kstDate(t);return type===0?`${d.getUTCFullYear()}`:type===1?`${d.getUTCMonth()+1}월`:type===2?`${d.getUTCMonth()+1}/${d.getUTCDate()}`:`${two(d.getUTCHours())}:${two(d.getUTCMinutes())}`}};
const side=v=>Number(v)>0?'롱':Number(v)<0?'숏':'혼합', signedClass=v=>Number(v)>=0?'positive':'negative';
const chart=LightweightCharts.createChart($('#mainChart'),{layout:{background:{type:'solid',color:'#0b0e11'},textColor:'#8490a3',fontFamily:'Inter,system-ui'},grid:{vertLines:{color:'#171d25'},horzLines:{color:'#171d25'}},crosshair:{mode:LightweightCharts.CrosshairMode.Normal,vertLine:{color:'#758195',style:2},horzLine:{color:'#758195',style:2}},rightPriceScale:{borderColor:'#252d38',minimumWidth:76,scaleMargins:{top:.08,bottom:.25}},timeScale:{borderColor:'#252d38',timeVisible:true,secondsVisible:false,fixRightEdge:true,tickMarkFormatter:kstAxis.tickMarkFormatter},handleScroll:true,handleScale:true,localization:kstAxis.localization});
for(const name of ['pointerdown','wheel','touchstart'])chart.chartElement().addEventListener(name,()=>{state.activePane=chart},{passive:true});
const candles=chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350',priceFormat:{type:'price',precision:1,minMove:.1}});
const volume=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'volume',lastValueVisible:false,priceLineVisible:false});chart.priceScale('volume').applyOptions({scaleMargins:{top:.78,bottom:0}});
const high20=chart.addLineSeries({color:'#f0b90b',lineWidth:1,lineStyle:2,lineType:LightweightCharts.LineType.WithSteps,lastValueVisible:true,priceLineVisible:false,title:''});
const low20=chart.addLineSeries({color:'#9c6ade',lineWidth:1,lineStyle:2,lineType:LightweightCharts.LineType.WithSteps,lastValueVisible:true,priceLineVisible:false,title:''});
new ResizeObserver(entries=>{const r=entries[0].contentRect;chart.applyOptions({width:r.width,height:r.height})}).observe($('#mainChart'));
chart.subscribeCrosshairMove(param=>{if(!param.time||!param.point){$('#tooltip').style.display='none';return}const c=param.seriesData.get(candles);if(c)$('#legend').innerHTML=`O ${num(c.open)} &nbsp; H ${num(c.high)} &nbsp; L ${num(c.low)} &nbsp; C ${num(c.close)}`;const hits=state.markerMap?.get(Number(param.time));if(!hits?.length){$('#tooltip').style.display='none';return}const m=hits[0],tip=$('#tooltip');tip.innerHTML=`<b>${m.kind==='entry'?'진입':'청산'} · ${m.side_label}</b><br>${kst(m.time_utc)} KST<br>가격 ${num(m.price)}<br>${m.pnl_usd==null?`net ${bps(m.net_bps)}`:`손익 ${usd(m.pnl_usd)}`}<br>사유 ${escapeHtml(m.exit_reason||'—')}`;tip.style.display='block';tip.style.left=Math.min(param.point.x+16,$('#mainChart').clientWidth-240)+'px';tip.style.top=Math.max(10,param.point.y-40)+'px'});
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showError(e){const bar=$('#errorbar');bar.textContent=`데이터 갱신 실패: ${e.message}`;bar.style.display='block';setTimeout(()=>bar.style.display='none',5000)}
function markerTime(t){const s=TF_SEC[state.tf];return Math.floor(Number(t)/s)*s}
function conditionText(kind,v){
  if(!v)return '계산 가능한 완성 봉이 없습니다.';
  if(v.text!=null)return v.text;
  if(kind==='breakout'){if(v.required_volume==null||v.prior_high_20==null)return '돌파: 20봉 준비 중 → 대기';const met=v.side>0;return `돌파: 거래량 필요 ${num(v.required_volume)} BTC / 현재 ${num(v.current_volume)} BTC, 직전 20봉 고가 ${num(v.prior_high_20)} 위 마감 필요 (현재가 대비 +${num(v.price_distance_pct,2)}%) → ${met?'롱 조건 충족':'대기'}`}
  const trend=kind==='trend',label=trend?'추세':'역추세',upperSide=trend?'롱':'숏',lowerSide=trend?'숏':'롱';if(v.long_account_pct==null||v.upper_pct==null||v.lower_pct==null)return `${label}: 기준선 준비 중 → 대기`;const result=v.side<0?'숏 조건 충족':v.side>0?'롱 조건 충족':'대기',du=v.distance_to_short,dl=v.distance_to_long;return `${label}: 롱 계정 비율 ${num(v.long_account_pct,1)}% (롱숏비율 ${num(v.global_ls_account,2)}) / ${upperSide} 기준 ${num(v.upper_pct,1)}% (롱숏비율 ${num(v.upper_threshold,2)}) 이상 / ${lowerSide} 기준 ${num(v.lower_pct,1)}% (롱숏비율 ${num(v.lower_threshold,2)}) 이하 / 남은 거리 ${upperSide} ${num(du.ratio,2)}·${num(du.pct_points,1)}%p, ${lowerSide} ${num(dl.ratio,2)}·${num(dl.pct_points,1)}%p → ${result}`
}
function conditionChartOptions(){return {layout:{background:{type:'solid',color:'#0b0e11'},textColor:'#8490a3',fontFamily:'Inter,system-ui'},grid:{vertLines:{color:'#171d25'},horzLines:{color:'#171d25'}},crosshair:{mode:LightweightCharts.CrosshairMode.Normal},rightPriceScale:{borderColor:'#252d38',minimumWidth:76,scaleMargins:{top:.18,bottom:.12}},timeScale:{borderColor:'#252d38',timeVisible:true,secondsVisible:false,fixRightEdge:true,tickMarkFormatter:kstAxis.tickMarkFormatter},localization:kstAxis.localization}}
function holdLast(points,cutoff){const end=Math.floor(new Date(cutoff).getTime()/1000);if(points.length&&end>points.at(-1).time)points.push({...points.at(-1),time:end});return points}
function heldPoints(rows,key,cutoff){return holdLast(rows.filter(x=>x[key]!=null).map(x=>({time:x.time,value:x[key]})),cutoff)}
function destroyConditionCharts(){
  for(const [c,h] of state.rangeHandlers)c.timeScale().unsubscribeVisibleTimeRangeChange(h);state.rangeHandlers=[];
  for(const o of state.conditionObservers)o.disconnect();state.conditionObservers=[];
  for(const c of state.conditionCharts)c.remove();state.conditionCharts=[];$('#conditionPanes').replaceChildren();
}
function syncConditionCharts(){
  // Main chart is the master. A condition pane drives the others only while the user is
  // touching it; programmatic range events (new panes, timeframe switch) never flow back.
  const charts=state.conditionCharts;
  const follow=skip=>{const range=chart.timeScale().getVisibleRange();if(range)for(const target of charts)if(target!==skip)try{target.timeScale().setVisibleRange(range)}catch{/* pane with no rows yet */}};
  follow();requestAnimationFrame(()=>{if(state.conditionCharts===charts)follow()});
  const mainHandler=()=>follow(state.activePane);chart.timeScale().subscribeVisibleTimeRangeChange(mainHandler);state.rangeHandlers.push([chart,mainHandler]);
  for(const c of charts){const handler=range=>{if(range&&state.activePane===c)chart.timeScale().setVisibleRange(range)};c.timeScale().subscribeVisibleTimeRangeChange(handler);state.rangeHandlers.push([c,handler]);
    for(const name of ['pointerdown','wheel','touchstart'])c.chartElement().addEventListener(name,()=>{state.activePane=c},{passive:true})}
}
function renderConditionSummary(data){

  $('#conditionSummary').innerHTML=`<div class="condition-clock ${s.holding?'holding':''}"><b>다음 결정 ${next}</b><br>${escapeHtml(s.holding_text)}</div>`+s.legs.map(leg=>{const five=leg.decision_cadence_minutes===5,actualLabel=five?'지난 5분 판단 실제 사용':'지난 정시 실제 사용',nextLabel=five?'다음 5분 판단':'다음 정시 예상',hold=leg.max_hold_hours==null?'':` · 최대 ${leg.max_hold_hours}시간`;return `<div class="condition-card"><h4>${escapeHtml(leg.name)}${hold}</h4><p class="actual"><b>${actualLabel}</b><br>${kst(leg.last_decision?.decision_time)} KST · ${escapeHtml(conditionText(leg.kind,leg.last_decision))}</p><p class="estimate"><b>${nextLabel}</b> <span class="muted">(${escapeHtml(s.estimate_label)})</span><br>${leg.next_estimate?`${kst(leg.next_estimate.decision_time)} KST · ${escapeHtml(conditionText(leg.kind,leg.next_estimate))}`:(five?'새 LS REST timestamp 대기':'아직 현재 시간봉 데이터 없음')}</p></div>`}).join('');
}
async function loadConditions(){
  const requested=`${state.book}|${state.tf}`,data=await api(`/api/conditions?book=${state.book}&tf=${state.tf}`);if(requested!==`${state.book}|${state.tf}`)return;state.data.conditions=data;renderConditionSummary(data);destroyConditionCharts();$('#chartStack').classList.toggle('combo',data.legs.length>1);
