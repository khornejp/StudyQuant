<script>
'use strict';
const BOOKS=['C1','F3','E1','C4'], TF_SEC={"1m":60,"5m":300,"15m":900,"1h":3600,"4h":14400,"1d":86400};
const state={tf:'1h',book:'C1',tab:'positions',data:{},sort:{key:null,asc:true},initialChart:true,markers:[],positionLine:null};
const $=s=>document.querySelector(s), api=async path=>{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(`${r.status} ${path}`);return r.json()};
const num=(v,d=1)=>v==null?'—':Number(v).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const bps=v=>v==null?'—':`${num(v,1)} bps`, pct=v=>v==null?'—':`${num(v*100,1)}%`;
const utcTip=v=>v?new Date(v).toISOString():'', kst=v=>v?new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'2-digit',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v)):'—';

const chart=LightweightCharts.createChart($('#mainChart'),{layout:{background:{type:'solid',color:'#0b0e11'},textColor:'#8490a3',fontFamily:'Inter,system-ui'},grid:{vertLines:{color:'#171d25'},horzLines:{color:'#171d25'}},crosshair:{mode:LightweightCharts.CrosshairMode.Normal,vertLine:{color:'#758195',style:2},horzLine:{color:'#758195',style:2}},rightPriceScale:{borderColor:'#252d38',scaleMargins:{top:.08,bottom:.25}},timeScale:{borderColor:'#252d38',timeVisible:true,secondsVisible:false},handleScroll:true,handleScale:true,localization:{locale:'ko-KR'}});
const candles=chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350',priceFormat:{type:'price',precision:1,minMove:.1}});
const volume=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'volume',lastValueVisible:false,priceLineVisible:false});chart.priceScale('volume').applyOptions({scaleMargins:{top:.78,bottom:0}});
new ResizeObserver(entries=>{const r=entries[0].contentRect;chart.applyOptions({width:r.width,height:r.height})}).observe($('#mainChart'));
chart.subscribeCrosshairMove(param=>{if(!param.time||!param.point){$('#tooltip').style.display='none';return}const c=param.seriesData.get(candles);if(c)$('#legend').innerHTML=`O ${num(c.open)} &nbsp; H ${num(c.high)} &nbsp; L ${num(c.low)} &nbsp; C ${num(c.close)}`;const hits=state.markerMap?.get(Number(param.time));if(!hits?.length){$('#tooltip').style.display='none';return}const m=hits[0],tip=$('#tooltip');tip.innerHTML=`<b>${m.kind==='entry'?'진입':'청산'} · ${m.side_label}</b><br>${kst(m.time_utc)} KST<br>가격 ${num(m.price)}<br>net ${bps(m.net_bps)}<br>사유 ${escapeHtml(m.exit_reason||'—')}`;tip.style.display='block';tip.style.left=Math.min(param.point.x+16,$('#mainChart').clientWidth-240)+'px';tip.style.top=Math.max(10,param.point.y-40)+'px'});
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showError(e){const bar=$('#errorbar');bar.textContent=`데이터 갱신 실패: ${e.message}`;bar.style.display='block';setTimeout(()=>bar.style.display='none',5000)}
function markerTime(t){const s=TF_SEC[state.tf];return Math.floor(Number(t)/s)*s}
async function loadChart(fit=false){
  const [data,marks,pos]=await Promise.all([api(`/api/candles?tf=${state.tf}`),api(`/api/markers?book=${state.book}`),api(`/api/positions?book=${state.book}`)]);
  candles.setData(data.rows.map(x=>({time:x.time,open:x.open,high:x.high,low:x.low,close:x.close})));

  const visible=new Set(data.rows.map(x=>x.time));state.markers=marks.rows;state.markerMap=new Map();
  const chartMarks=[];for(const m of marks.rows){const time=markerTime(m.time);if(!visible.has(time))continue;(state.markerMap.get(time)||state.markerMap.set(time,[]).get(time)).push(m);chartMarks.push({time,position:m.kind==='entry'?(m.side>0?'belowBar':'aboveBar'):(m.side>0?'aboveBar':'belowBar'),color:m.kind==='entry'?(m.side>0?'#26a69a':'#ef5350'):'#f0b90b',shape:m.kind==='entry'?(m.side>0?'arrowUp':'arrowDown'):'circle',text:m.kind==='exit'?`${num(m.net_bps)}b`:''})}candles.setMarkers(chartMarks);
  if(state.positionLine){candles.removePriceLine(state.positionLine);state.positionLine=null}const p=pos.rows[0];if(p?.entry_price!=null)state.positionLine=candles.createPriceLine({price:Number(p.entry_price),color:'#2962ff',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:`${side(p.side)} 진입 · 평가 ${num(p.unrealized_bps)} bps`});
  if(fit||state.initialChart){chart.timeScale().fitContent();state.initialChart=false}
}
async function loadTop(){const s=await api('/api/status');state.data.status=s;$('#lastPrice').textContent=num(s.market.latest_price);const c=$('#change24');c.textContent=s.market.change_24h_pct==null?'—':`${s.market.change_24h_pct>=0?'+':''}${num(s.market.change_24h_pct,2)}%`;c.className=signedClass(s.market.change_24h_pct);$('#t0State').textContent=`${s.t0.state} · D+${s.t0.elapsed_days}`;const collector=s.collector.state,$c=$('#collector');$c.innerHTML=`<i class="dot ${collector==='정상'?'ok':collector==='갭'?'gap':'delay'}"></i>${collector}`;$('#telegram').textContent=s.telegram.label;$('#refreshKst').textContent=`${kst(s.last_refresh_utc)} KST`;$('#refreshUtc').textContent=`${new Date(s.last_refresh_utc).toISOString().replace('.000','')} UTC`}
async function loadSide(){const [perf,books,ref]=await Promise.all([api(`/api/performance?book=${state.book}`),api('/api/books'),api('/api/reference')]);state.data.performance=perf;state.data.books=books.rows;for(const r of books.rows){for(const id of ['book','filterBook']){const select=$('#'+id);if(![...select.options].some(x=>x.value===r.book))select.add(new Option(r.book,r.book))}}$('#selectedBook').textContent=state.book;const s=perf.summary;$('#cards').innerHTML=[['누적 net PESS',bps(s.net_pess_bps),signedClass(s.net_pess_bps)],['누적 net OPT',bps(s.net_opt_bps),signedClass(s.net_opt_bps)],['거래 수',num(s.trade_count,0),''],['승률',pct(s.win_rate),''],['최대 낙폭',bps(s.max_drawdown_bps),'negative'],['바이앤홀드 대비',bps(s.vs_buy_hold_bps),signedClass(s.vs_buy_hold_bps)]].map(x=>`<div class="card"><span>${x[0]}</span><strong class="${x[2]}">${x[1]}</strong></div>`).join('');$('#bookCompare').innerHTML=books.rows.map(r=>`<tr class="${r.book===state.book?'selected':''}" data-book="${r.book}"><td>${r.book}</td><td class="${signedClass(r.net_pess_bps)}">${num(r.net_pess_bps)}</td><td class="${signedClass(r.net_opt_bps)}">${num(r.net_opt_bps)}</td><td>${r.trades}</td><td>${pct(r.win_rate)}</td></tr>`).join('');$('#reference').textContent=ref.rows.length?ref.rows.slice(0,12).map(r=>`${r.timing_status}\n${Object.entries(r).filter(([k])=>['timing_status','reference_primary'].indexOf(k)<0).slice(0,4).map(([k,v])=>`${k}: ${v}`).join(' · ')}`).join('\n\n'):'참고값 파일 없음';document.querySelectorAll('#bookCompare tr').forEach(x=>x.onclick=()=>{$('#book').value=x.dataset.book;changeBook(x.dataset.book)})}
const columns={positions:[['book','장부'],['side','방향','side'],['candidate','후보'],['entry_time','진입 시각','time'],['entry_price','진입가','price'],['unrealized_bps','평가손익','bps'],['remaining_minutes','잔여 분'],['updated_at','갱신 시각','time']],trades:[['book','장부'],['boundary','경계'],['side','방향','side'],['entry_time','진입 시각','time'],['exit_time','청산 시각','time'],['entry_price','진입가','price'],['exit_price','청산가','price'],['gross_bps','gross','bps'],['cost_bps','비용','bps'],['funding_bps','펀딩','bps'],['net_bps','net','bps'],['hold_minutes','보유 분'],['exit_reason','청산 사유']],signals:[['book','장부'],['decision_time','결정 시각','time'],['entry_time','진입 예정','time'],['candidate','후보'],['side','방향','side'],['accepted','채택','bool'],['reason','버린 사유']]};
function display(v,type){if(v==null)return '—';if(type==='time')return `<span title="${utcTip(v)}">${kst(v)}</span>`;if(type==='side')return side(v);if(type==='price')return num(v);if(type==='bps')return `<span class="${signedClass(v)}">${num(v)} bps</span>`;if(type==='bool')return Number(v)?'채택':'버림';return escapeHtml(v)}
function filtered(rows){let out=[...rows],book=$('#filterBook').value,sideValue=$('#filterSide').value,days=$('#filterPeriod').value;if(book)out=out.filter(x=>x.book===book);if(sideValue)out=out.filter(x=>String(x.side)===sideValue);if(days!=='all'){const cutoff=Date.now()-Number(days)*864e5;out=out.filter(x=>new Date(x.entry_time||x.decision_time||x.updated_at).getTime()>=cutoff)}if(state.sort.key)out.sort((a,b)=>{const av=a[state.sort.key],bv=b[state.sort.key];return (typeof av==='number'?av-bv:String(av??'').localeCompare(String(bv??''),undefined,{numeric:true}))*(state.sort.asc?1:-1)});return out}

function renderTable(kind,rows){const cols=columns[kind],data=filtered(rows);state.visibleRows=data;if(!data.length){$('#panel').innerHTML=`<div class="empty">${emptyMessage()}</div>`;return}$('#panel').innerHTML=`<table class="data-table"><thead><tr>${cols.map(c=>`<th data-key="${c[0]}">${c[1]}${state.sort.key===c[0]?(state.sort.asc?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${data.map(r=>`<tr>${cols.map(c=>`<td>${display(r[c[0]],c[2])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;document.querySelectorAll('.data-table th').forEach(th=>th.onclick=()=>{state.sort.asc=state.sort.key===th.dataset.key?!state.sort.asc:true;state.sort.key=th.dataset.key;renderTable(kind,rows)})}
async function renderTab(){const panel=$('#panel'),filters=$('.filters');panel.classList.add('loading');try{if(['positions','trades','signals'].includes(state.tab)){filters.style.display='flex';const d=await api(`/api/${state.tab}`);state.data[state.tab]=d.rows;renderTable(state.tab,d.rows)}else if(state.tab==='performance'){filters.style.display='none';const p=await api(`/api/performance?book=${state.book}`);state.data.performance=p;panel.innerHTML='<div class="performance-grid"><div><div id="equity" class="plot"></div><div id="drawdown" class="plot"></div></div><div class="monthly"><h3>월별 net bps</h3><div id="monthlyTable"></div></div></div>';const colors={PESS:'#ef5350',OPT:'#26a69a',BUY_HOLD:'#8490a3'},layout=t=>({title:{text:t,font:{size:13}},paper_bgcolor:'#11161d',plot_bgcolor:'#11161d',font:{color:'#9aa6b8',size:11},margin:{l:55,r:15,t:35,b:35},xaxis:{gridcolor:'#252d38'},yaxis:{gridcolor:'#252d38'},legend:{orientation:'h'}});Plotly.react('equity',p.series.map(s=>({x:s.date,y:s.cumulative_net_bps,name:s.name,line:{color:colors[s.name]}})),layout('누적 손익 vs 바이앤홀드'),{displayModeBar:false,responsive:true});Plotly.react('drawdown',p.series.map(s=>({x:s.date,y:s.drawdown_bps,name:s.name,line:{color:colors[s.name]}})),layout('낙폭'),{displayModeBar:false,responsive:true});$('#monthlyTable').innerHTML=p.monthly.length?`<table class="data-table"><tr><th>월</th><th>경계</th><th>net</th></tr>${p.monthly.map(x=>`<tr><td>${x.month}</td><td>${x.boundary}</td><td>${bps(x.net_bps)}</td></tr>`).join('')}</table>`:`<div class="empty">${emptyMessage()}</div>`}else{filters.style.display='none';const s=await api('/api/status');state.data.status=s;panel.innerHTML=`<div class="status-grid"><div class="status-card"><h3>소스 지연 (최근 24시간)</h3>${s.latency.length?`<table class="data-table"><tr><th>소스</th><th>표본</th><th>p50</th><th>p95</th></tr>${s.latency.map(x=>`<tr><td>${x.source}</td><td>${x.count}</td><td>${num(x.p50_ms)} ms</td><td>${num(x.p95_ms)} ms</td></tr>`).join('')}</table>`:'데이터 없음'}</div><div class="status-card"><h3>시스템</h3><div class="status-line"><span>갭(24h)</span><b>${s.collector.gap_count_24h}</b></div><div class="status-line"><span>bookTicker</span><b>${s.book_ticker.rows}행 · 갭 ${s.book_ticker.gaps}</b></div><div class="status-line"><span>대조</span><b>${s.reconcile.result} (${s.reconcile.revision_count})</b></div><div class="status-line"><span>디스크 여유</span><b class="${s.disk_warning?'negative':''}">${num(s.disk_free_ratio*100)}%</b></div><div class="status-line"><span>텔레그램 outbox</span><b>대기 ${s.notifications.pending} · 실패 ${s.notifications.failed}</b></div><div class="status-line"><span>WS 종료</span><b>${s.ws_closed_events}</b></div></div></div>`}}catch(e){showError(e);panel.innerHTML='<div class="empty">데이터를 불러오지 못했습니다</div>'}finally{panel.classList.remove('loading')}}
async function changeBook(book){state.book=book;$('#filterBook').value=book;state.initialChart=true;try{await Promise.all([loadChart(true),loadSide(),renderTab()])}catch(e){showError(e)}}
document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-tf]').forEach(x=>x.classList.toggle('active',x===b));state.tf=b.dataset.tf;state.initialChart=true;try{await loadChart(true)}catch(e){showError(e)}});$('#book').onchange=e=>changeBook(e.target.value);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));state.tab=b.dataset.tab;state.sort={key:null,asc:true};renderTab()});['filterBook','filterPeriod','filterSide'].forEach(id=>$('#'+id).onchange=()=>renderTable(state.tab,state.data[state.tab]||[]));
$('#csv').onclick=()=>{const rows=state.visibleRows||[];if(!rows.length)return;const keys=Object.keys(rows[0]),quote=v=>`"${String(v??'').replaceAll('"','""')}"`,csv='\ufeff'+[keys.map(quote).join(','),...rows.map(r=>keys.map(k=>quote(r[k])).join(','))].join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`paper_${state.tab}_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)};
async function init(){try{await Promise.all([loadTop(),loadChart(true),loadSide(),renderTab()])}catch(e){showError(e)}}init();setInterval(()=>Promise.all([loadTop(),loadChart(false)]).catch(showError),5000);
</script>
</body>
